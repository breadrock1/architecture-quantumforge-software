name: 'quantumforge'

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    networks:
      - quantumforge-net
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - 'qdrant-vol:/qdrant/storage'
    environment:
      QDRANT__SERVICE__API_KEY: '58d2ea2e-209b-4ea5-a6eb-df3590a21da4'
      QDRANT__SERVICE__ENABLE_API_KEY: true

  ollama:
    image: ollama/ollama:0.11.11-rc2-rocm
    restart: unless-stopped
    networks:
      - quantumforge-net
    ports:
      - '11434:11434'
    volumes:
      - 'ollama-vol:/root/.ollama'
    deploy:
      resources:
        limits:
          memory: '4G'

  embeddings:
    image: jgquiroga/hugging-face-text-embedding:v0.4.0
    restart: unless-stopped
    networks:
      - quantumforge-net
    ports:
      - '3242:80'
    deploy:
      resources:
        limits:
          memory: '2G'

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - quantumforge-net
    ports:
      - '2891:2891'
    env_file:
      - .env

networks:
  quantumforge-net:
    name: quantumforge-net
    driver: bridge

volumes:
  ollama-vol:
    name: quantumforge-ollama-vol
    driver: local
  qdrant-vol:
    name: quantumforge-qdrant-vol
    driver: local
